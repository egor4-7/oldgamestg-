<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Game Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }
        body {
            background-color: #0d0f18;
            color: #00ffcc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        /* Заставка */
        #splash-screen {
            background: radial-gradient(circle, #1a1c29 0%, #0d0f18 100%);
            z-index: 10;
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #ff00ff;
        }
        .play-btn {
            background: linear-gradient(45deg, #00ffcc, #ff00ff);
            border: none;
            color: #0d0f18;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        /* Меню игр */
        #menu-screen {
            justify-content: flex-start;
            padding: 20px;
            overflow-y: auto;
        }
        .menu-title {
            font-size: 1.5rem;
            margin: 10px 0 20px 0;
            color: #ff00ff;
            text-align: center;
        }
        .games-list {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }
        .game-card {
            background: #191c2d;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .game-card h3 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 3px;
        }
        .game-card p {
            color: #8a8d9f;
            font-size: 0.8rem;
        }
        .game-icon {
            font-size: 2rem;
        }
        /* Игровой экран */
        #game-screen {
            background: #0d0f18;
            padding: 15px;
            justify-content: space-between;
        }
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: transparent;
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        canvas {
            background: #111;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <!-- Заставка -->
    <div id="splash-screen" class="screen">
        <div class="logo">🕹️ RETRO<br>ARCADE HUB</div>
        <button class="play-btn" onclick="openMenu()">ИГРАТЬ</button>
    </div>

    <!-- Меню игр -->
    <div id="menu-screen" class="screen hidden">
        <h2 class="menu-title">Выберите игру</h2>
        <div class="games-list">
            <div class="game-card" onclick="alert('Змейка загружается!')">
                <div>
                    <h3>🐍 Змейка</h3>
                    <p>Классика Nokia с растущим хвостом</p>
                </div>
                <div class="game-icon">▶</div>
            </div>
            <div class="game-card" onclick="alert('Тетрис в разработке')">
                <div>
                    <h3>🧱 Тетрис</h3>
                    <p>Складывай падающие фигурки</p>
                </div>
                <div class="game-icon">▶</div>
            </div>
            <div class="game-card" onclick="alert('Понг в разработке')">
                <div>
                    <h3>🏓 Ретро Понг</h3>
                    <p>Легендарный теннис</p>
                </div>
                <div class="game-icon">▶</div>
            </div>
            <div class="game-card" onclick="alert('Динозаврик в разработке')">
                <div>
                    <h3>🦖 Динозаврик</h3>
                    <p>Прыгай через препятствия</p>
                </div>
                <div class="game-icon">▶</div>
            </div>
            <div class="game-card" onclick="alert('Сапер в разработке')">
                <div>
                    <h3>💣 Сапер</h3>
                    <p>Найди мины и не подорвись</p>
                </div>
                <div class="game-icon">▶</div>
            </div>
            <div class="game-card" onclick="alert('Пятнашки в разработке')">
                <div>
                    <h3>🔲 Пятнашки</h3>
                    <p>Собери цифры по порядку</p>
                </div>
                <div class="game-icon">▶</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function openMenu() {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
