<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пекарня «У бабушки»</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Свежая выпечка 🥐</h1>
        <div id="catalog" class="catalog">
            <!-- Карточки товаров генерируются через JavaScript -->
        </div>
        
        <div class="cart">
            <h2>Корзина</h2>
            <div id="cart-items">Пусто</div>
            <div class="total">Итого: <span id="total-price">0</span> ₽</div>
            <button id="order-btn" class="btn" disabled>Оплатить заказ</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
