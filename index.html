<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Game Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #0d0f18;
            color: #00ffcc;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }

        /* Заставка */
        #splash-screen {
            background: radial-gradient(circle, #1a1c29 0%, #0d0f18 100%);
            z-index: 10;
            text-align: center;
        }
        .logo-glow {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #ff00ff;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px #00ffcc; }
            100% { transform: scale(1.03); text-shadow: 0 0 20px #ff00ff; }
        }
        .play-btn {
            background: linear-gradient(45deg, #00ffcc, #ff00ff);
            border: none;
            color: #0d0f18;
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        /* Меню игр с плавным скроллом */
        #menu-screen {
            justify-content: flex-start;
            padding: 20px 15px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .menu-title {
            font-size: 1.5rem;
            margin: 10px 0 20px 0;
            color: #ff00ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .games-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 30px;
        }
        .game-card {
            background: rgba(25, 28, 45, 0.9);
            border: 2px solid #00ffcc;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .game-card:active {
            transform: scale(0.98);
            background: rgba(0, 255, 204, 0.15);
        }
        .game-info h3 {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 4px;
        }
        .game-info p {
            font-size: 0.8rem;
            color: #8a8d9f;
        }
        .game-icon {
            font-size: 2rem;
        }

        /* Экран игры */
        #game-screen {
            background: #0d0f18;
            padding: 15px;
            justify-content: space-between;
        }
        .game-header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: transparent;
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #game-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 15px 0;
        }
        canvas {
            background: #111;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <!-- 1. Заставка -->
    <div id="splash-screen" class="screen">
        <div class="logo-glow">🕹️ RETRO<br>ARCADE HUB</div>
        <button class="play-btn" onclick="openMenu()">ИГРАТЬ</button>
    </div>

    <!-- 2. Меню выбора игр -->
    <div id="menu-screen" class="screen hidden">
        <h2 class="menu-title">Выберите игру</h2>
        <div class="games-container">
            <div class="game-card" onclick="startGame('snake')">
