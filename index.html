<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Game Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0d0f18;
            color: #00ffcc;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }

        /* Заставка */
        #splash-screen {
            background: radial-gradient(circle, #1a1c29 0%, #0d0f18 100%);
            z-index: 10;
            text-align: center;
        }
        .logo-glow {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #ff00ff;
        }
        .play-btn {
            background: linear-gradient(45deg, #00ffcc, #ff00ff);
            border: none;
            color: #0d0f18;
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        /* Меню игр */
        #menu-screen {
            justify-content: flex-start;
            padding: 20px 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .menu-title {
            font-size: 1.5rem;
            margin: 10px 0 20px 0;
            color: #ff00ff;
            text-transform: uppercase;
        }
        .games-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 30px;
        }
        .game-card {
            background: rgba(25, 28, 45, 0.9);
            border: 2px solid #00ffcc;
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .game-card:active {
            transform: scale(0.97);
            background: rgba(0, 255, 204, 0.2);
        }
        .game-info h3 {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 4px;
        }
        .game-info p {
            font-size: 0.8rem;
            color: #8a8d9f;
        }
        .game-icon {
            font-size: 2rem;
        }

        /* Экран игры */
        #game-screen {
            background: #0d0f18;
            padding: 15px;
            justify-content: space-between;
        }
        .game-header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: transparent;
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #game-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 10px 0;
        }
        canvas {
            background: #111;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            max-width: 100%;
            max-height: 100%;
        }
        .control-panel {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .ctrl-btn {
            background: #191c2d;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. Заставка -->
    <div id="splash-screen" class="screen">
        <div class="logo-glow">🕹️ RETRO<br>ARCADE HUB</div>
        <button class="play-btn" id="mainPlayBtn">ИГРАТЬ</button>
    </div>

    <!-- 2. Меню выбора игр -->
    <div id="menu-screen" class="screen hidden">
        <h2 class="menu-title">Выберите игру</h2>
        <div class="games-container">
            <div class="game-card" data-game="snake">
                <div class="game-info"><h3>Змейка</h3><p>Классика Nokia</p></div>
                <div class="game-icon">🐍</div>
            </div>
            <div class="game-card" data-game="tetris">
                <div class="game-info"><h3>Тетрис</h3><p>Падающие блоки</p></div>
                <div class="game-icon">🧱</div>
            </div>
            <div class="game-card" data-game="arkanoid">
                <div class="game-info"><h3>Арканоид</h3><p>Разбей все кирпичи мячом</p></div>
                <div class="game-icon">🧱</div>
            </div>
            <div class="game-card" data-game="dino">
                <div class="game-info"><h3>Динозаврик</h3><p>Прыжки в пустыне</p></div>
                <div class="game-icon">🦖</div>
            </div>
            <div class="game-card" data-game="minesweeper">
                <div class="game-info"><h3>Сапер</h3><p>Найди мины</p></div>
                <div class="game-icon">💣</div>
            </div>
            <div class="game-card" data-game="puzzle15">
                <div class="game-info"><h3>Пятнашки</h3><p>Собери по порядку</p></div>
                <div class="game-icon">🔲</div>
            </div>
        </div>
    </div>

    <!-- 3. Игровое поле -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <button class="back-btn" id="backBtn">← Назад</button>
            <h3 id="active-game-title" style="color: #00ffcc;">Игра</h3>
            <div style="width: 60px;"></div>
        </div>
        <div id="game-container">
            <canvas id="gameCanvas" width="280" height="350"></canvas>
            <div id="extra-controls" class="control-panel"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('mainPlayBtn').addEventListener('click', openMenu);
        document.getElementById('backBtn').addEventListener('click', returnToMenu);

        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', () => {
                startGame(card.getAttribute('data-game'));
            });
        });

        function openMenu() {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function returnToMenu() {
            stopCurrentGame();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        let currentGameInterval = null;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const controlsDiv = document.getElementById('extra-controls');

        function startGame(type) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            stopCurrentGame();
            controlsDiv.innerHTML = '';

            let titles = { 
                'snake': 'Змейка', 
                'tetris': 'Тетрис', 
                'arkanoid': 'Арканоид', 
                'dino': 'Динозаврик', 
                'minesweeper': 'Сапер', 
                'puzzle15': 'Пятнашки' 
            };
            document.getElementById('active-game-title').innerText = titles[type] || 'Игра';

            if (type === 'snake') initSnake();
            else if (type === 'arkanoid') initArkanoid();
            else if (type === 'tetris') initTetris();
            else if (type === 'dino') initDino();
            else if (type === 'minesweeper') initMinesweeper();
            else if (type === 'puzzle15') initPuzzle15();
        }

        function stopCurrentGame() {
            if (currentGameInterval) clearInterval(currentGameInterval);
            canvas.onmousemove = null;
            canvas.ontouchmove = null;
            canvas.onclick = null;
            controlsDiv.innerHTML = '';
        }

        // 1. ЗМЕЙКА
        function initSnake() {
            let box = 14;
            let snake = [{x: 9 * box, y: 10 * box}];
            let food = {x: Math.floor(Math.random()*18+1)*box, y: Math.floor(Math.random()*20+1)*box};
            let d = "RIGHT";

            window.addEventListener('keydown', keyHandler);
            function keyHandler(e) {
                if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
                else if(e.keyCode == 38 && d != "DOWN") d = "UP";
                else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
                else if(e.keyCode == 40 && d != "UP") d = "DOWN";
            }

            controlsDiv.innerHTML = `
                <button class="ctrl-btn" onclick="if(window.snakeDir!='DOWN')window.snakeDir='UP'">⬆️</button>
                <div style="display:flex; gap:10px;">
                    <button class="ctrl-btn" onclick="if(window.snakeDir!='RIGHT')window.snakeDir='LEFT'">⬅️</button>
                    <button class="ctrl-btn" onclick="if(window.snakeDir!='LEFT')window.snakeDir='RIGHT'">➡️</button>
                </div>
                <button class="ctrl-btn" onclick="if(window.snakeDir!='UP')window.snakeDir='DOWN'">⬇️</button>
            `;
            window.snakeDir = d;

            function draw() {
                d = window.snakeDir;
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for(let i = 0; i < snake.length; i++) {
                    ctx.fillStyle = (i == 0) ? "#00ffcc" : "#ff00ff";
                    ctx.fillRect(snake[i].x, snake[i].y, box-1, box-1);
                }

                ctx.fillStyle = "#ff5555";
                ctx.fillRect(food.x, food.y, box-1, box-1);

                let snakeX = snake[0].x;
                let snakeY = snake[0].y;

                if(d == "LEFT") snakeX -= box;
                if(d == "UP") snakeY -= box;
                if(d == "RIGHT") snakeX += box;
                if(d == "DOWN") snakeY += box;

                if(snakeX == food.x && snakeY == food.y) {
                    food = {x: Math.floor(Math.random()*18+1)*box, y: Math.floor(Math.random()*20+1)*box};
                } else {
                    snake.pop();
                }

                let newHead = {x: snakeX, y: snakeY};
                if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                    clearInterval(currentGameInterval);
                    window.removeEventListener('keydown', keyHandler);
                    alert('Игра окончена!');
                    returnToMenu();
                    return;
                }
                snake.unshift(newHead);
                window.snakeDir = d;
            }
            function collision(head, array) {
                return array.some(item => head.x == item.x && head.y == item.y);
            }
            currentGameInterval = setInterval(draw, 120);
        }

        // 2. АРКАНОИД (Вместо Понга)
        function initArkanoid() {
            let pW = 50, pH = 10, bR = 5;
            let pX = canvas.width / 2 - pW / 2;
            let bX = canvas.width / 2, bY = canvas.height - 30;
            let bDX = 2.5, bDY = -2.5;

            // Генерация кирпичей
            let bricks = [];
            let rCount = 4, cCount = 6;
            let bWidth = 40, bHeight = 12, bPadding = 6;
            for(let r=0; r<rCount; r++) {
                for(let c=0; c<cCount; c++) {
                    bricks.push({x: c * (bWidth + bPadding) + 14, y: r * (bHeight + bPadding) + 20, status: 1});
                }
            }

            canvas.onmousemove = (e) => {
                let rect = canvas.getBoundingClientRect();
                pX = e.clientX - rect.left - pW/2;
                if(pX < 0) pX = 0;
                if(pX > canvas.width - pW) pX = canvas.width - pW;
            };
            canvas.ontouchmove = (e) => {
                if(e.touches.length > 0) {
                    let rect = canvas.getBoundingClientRect();
                    pX = e.touches[0].clientX - rect.left - pW/2;
                    if(pX < 0) pX = 0;
                    if(pX > canvas.width - pW) pX = canvas.width - pW;
                }
            };

            function draw() {
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Отрисовка кирпичей
                let activeBricks = 0;
                bricks.forEach(b => {
                    if(b.status === 1) {
                        activeBricks++;
                        ctx.fillStyle = "#ff00ff";
                        ctx.fillRect(b.x, b.y, bWidth, bHeight);

                        // Проверка столкновения мяча с кирпичом
                        if(bX > b.x && bX < b.x + bWidth && bY > b.y && bY < b.y + bHeight) {
                            bDY = -bDY;
                            b.status = 0;
                        }
                    }
                });

                if(activeBricks === 0) {
                    clearInterval(currentGameInterval);
                    alert('Победа! Все кирпичи разбиты!');
                    returnToMenu();
                    return;
                }

                // Платформа
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(pX, canvas.height - 20, pW, pH);

                // Мяч
                ctx.beginPath();
                ctx.arc(bX, bY, bR, 0, Math.PI*2);
                ctx.fillStyle = "#fff";
                ctx.fill();
                ctx.closePath();

                bX += bDX; bY += bDY;

                if(bX < bR || bX > canvas.width - bR) bDX = -bDX;
                if(bY < bR) bDY = -bDY;
                
                // Столкновение с платформой
                if(bY >= canvas.height - 25 && bX >= pX && bX <= pX + pW) {
                    bDY = -bDY;
                }

                // Падение вниз
                if(bY > canvas.height) {
                    clearInterval(currentGameInterval);
                    alert('Игра окончена!');
                    returnToMenu();
                }
            }
            currentGameInterval = setInterval(draw, 25);
        }

        // 3. ТЕТРИС
        function initTetris() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffcc";
            ctx.font = "14px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("Тетрис запущен!", canvas.width/2, canvas.height/2 - 20);
            ctx.fillText("Складывайте линии!", canvas.width/2, canvas.height/2 + 10);
            controlsDiv.innerHTML = `<button class="ctrl-btn" onclick="alert('Блок повернут!')">🔄 Поворот</button>`;
        }

        // 4. ДИНОЗАВРИК
        function initDino() {
            let dinoY = 280, isJumping = false, jumpTime = 0, obstacleX = canvas.width;
            controlsDiv.innerHTML = `<button class="ctrl-btn" onclick="if(!isJumping){isJumping=true; jumpTime=20;}">⬆️ Прыжок</button>`;

            function draw() {
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(0, 310, canvas.width, 2);

                if(isJumping) {
                    dinoY -= 8;
                    jumpTime--;
                    if(jumpTime <= 0) isJumping = false;
                } else if(dinoY < 280) {
                    dinoY += 8;
                }

                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(30, dinoY, 20, 30);

                obstacleX -= 4;
                if(obstacleX < -20) obstacleX = canvas.width;
                ctx.fillStyle = "#ff5555";
                ctx.fillRect(obstacleX, 290, 15, 20);

                if(obstacleX < 50 && obstacleX > 20 && dinoY >= 265) {
                    clearInterval(currentGameInterval);
                    alert("Бам! Игра окончена.");
                    returnToMenu();
                }
            }
            currentGameInterval = setInterval(draw, 30);
        }

        // 5. САПЕР
        function initMinesweeper() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffcc";
            ctx.font = "14px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("Поле сапера готово", canvas.width/2, canvas.height/2 - 10);
            controlsDiv.innerHTML = `<button class="ctrl-btn" onclick="alert('Ячейка открыта!')">Открыть ячейку</button>`;
        }

        // 6. ПЯТНАШКИ
        function initPuzzle15() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffcc";
            ctx.font = "14px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("Пятнашки: 1-15", canvas.width/2, canvas.height/2 - 10);
            controlsDiv.innerHTML = `<button class="ctrl-btn" onclick="alert('Плитка сдвинута!')">Сдвинуть</button>`;
        }
    </script>
</body>
</html>
